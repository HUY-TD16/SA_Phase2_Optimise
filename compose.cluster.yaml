services:
  api:
    ports: !reset []

  api-2:
    extends:
      file: compose.yaml
      service: api
    ports: !reset []

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./infra/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_healthy
      api-2:
        condition: service_healthy
    mem_limit: 128m
